[package]
name = "qpid"
version = "0.1.0"
edition = "2021"
default-run = "qpid"

[[bin]]
name = "qpid"
path = "src/main.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "unstable-winit-030"] }
cpal = "0.15"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm", "alac"] }
rubato = "0.15"
rtrb = "0.3"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
natord = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
] }

[build-dependencies]
slint-build = "1"
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Dependencies are size-optimized: the exe-size budget (10 MB) binds harder
# than dependency speed — decode/resample are far from saturating one core
# at 1x (see architecture.md section 14; re-check the 2x CPU budget if this
# ever regresses).
[profile.release.package."*"]
opt-level = "s"

# FFT is the resampler's hot path and its size cost at -O3 is only ~8 KB
# after LTO (measured), so keep it fast while everything else shrinks.
[profile.release.package.rustfft]
opt-level = 3

[profile.dev]
# Keep dependency builds fast; app code itself is small.
opt-level = 0
